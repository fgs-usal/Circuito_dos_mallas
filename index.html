<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuito de Dos Mallas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Simulador de Circuito de Dos Mallas</h1>
            <p>Configura los elementos de cada malla. El circuito se actualizará automáticamente.</p>
        </header>
        
        <main class="main-content">
            <aside class="controls">
                <h2>Configuración</h2>
                
                <div class="control-group">
                    <h3>Rama Izquierda (Malla 1)</h3>
                    <label>Tipo de Elemento 1:</label>
                    <select id="el1-type">
                        <option value="battery">Batería</option>
                        <option value="resistor">Resistencia</option>
                        <option value="short">Cortocircuito</option>
                    </select>
                    <div id="el1-val-container" class="value-container">
                        <label>Valor (<span id="el1-unit">V</span>):</label>
                        <input type="number" id="el1-val" value="12" step="0.1">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Rama Superior Izquierda (Malla 1)</h3>
                    <label>Tipo de Elemento 2:</label>
                    <select id="el2-type">
                        <option value="resistor" selected>Resistencia</option>
                        <option value="battery">Batería</option>
                        <option value="short">Cortocircuito</option>
                    </select>
                    <div id="el2-val-container" class="value-container">
                        <label>Valor (<span id="el2-unit">Ω</span>):</label>
                        <input type="number" id="el2-val" value="10" step="0.1">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Rama Central (Compartida)</h3>
                    <label>Tipo de Elemento 3:</label>
                    <select id="el3-type">
                        <option value="resistor" selected>Resistencia</option>
                        <option value="battery">Batería</option>
                        <option value="short">Cortocircuito</option>
                    </select>
                    <div id="el3-val-container" class="value-container">
                        <label>Valor (<span id="el3-unit">Ω</span>):</label>
                        <input type="number" id="el3-val" value="5" step="0.1">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Rama Superior Derecha (Malla 2)</h3>
                    <label>Tipo de Elemento 4:</label>
                    <select id="el4-type">
                        <option value="resistor" selected>Resistencia</option>
                        <option value="battery">Batería</option>
                        <option value="short">Cortocircuito</option>
                    </select>
                    <div id="el4-val-container" class="value-container">
                        <label>Valor (<span id="el4-unit">Ω</span>):</label>
                        <input type="number" id="el4-val" value="20" step="0.1">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Rama Derecha (Malla 2)</h3>
                    <label>Tipo de Elemento 5:</label>
                    <select id="el5-type">
                        <option value="short" selected>Cortocircuito</option>
                        <option value="resistor">Resistencia</option>
                        <option value="battery">Batería</option>
                    </select>
                    <div id="el5-val-container" class="value-container hidden">
                        <label>Valor (<span id="el5-unit">Ω</span>):</label>
                        <input type="number" id="el5-val" value="0" step="0.1">
                    </div>
                </div>
            </aside>

            <section class="circuit-view">
                <div class="canvas-container">
                    <svg id="circuit-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                        <!-- El circuito se dibujará aquí dinámicamente -->
                    </svg>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
